
name: Deploy React Frontend to Azure

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_JOB_MAINTENANCE_API_BASE_URL: ${{ vars.VITE_JOB_MAINTENANCE_API_BASE_URL }}
      VITE_BILLING_API_BASE_URL: ${{ vars.VITE_BILLING_API_BASE_URL }}
      VITE_INVENTORY_API_BASE_URL: ${{ vars.VITE_INVENTORY_API_BASE_URL }}
      VITE_NOTIFICATION_API_BASE_URL: ${{ vars.VITE_NOTIFICATION_API_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify API URLs
        shell: bash
        run: |
          required=(
            VITE_API_BASE_URL
            VITE_JOB_MAINTENANCE_API_BASE_URL
            VITE_BILLING_API_BASE_URL
            VITE_INVENTORY_API_BASE_URL
            VITE_NOTIFICATION_API_BASE_URL
          )

          for variable in "${required[@]}"; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::$variable is missing"
              exit 1
            fi
          done

      - name: Build React application
        working-directory: frontend
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          api_location: ''
          output_location: ''
          skip_app_build: true
